info:
  name: Update Room Settings
  type: http
  seq: 4

http:
  method: PUT
  url: "{{TURING_TOWN_API}}/room/2169-14B7/settings"
  headers:
    - name: X-Host-Token
      value: "<hostToken from Create Room>"
  body:
    type: json
    data: |-
      {
        "MaxPlayers": 4,
        "FamilyFriendly": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
