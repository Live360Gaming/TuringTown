name: Deploy

# Production deploys happen only when a stable GitHub Release is published.
# Drafts never fire "published"; prereleases are skipped by the guard job.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/live360gaming/turingtown

jobs:
  guard:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$TAG' must be vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Release commit is not on main."; exit 1; }

  ci:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.release.tag_name }}
          cache-from: type=gha

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.verify.outputs.url }}
    permissions:
      contents: read
      id-token: write
    env:
      APP: ${{ vars.AZURE_WEBAPP_NAME }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Updates only the image and port of the existing main container, so any
      # registry credentials already configured on it are preserved.
      - name: Deploy image by digest
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}
          CONTAINER: ${{ vars.AZURE_CONTAINER_NAME }}
          PORT: ${{ vars.AZURE_CONTAINER_PORT }}
        run: |
          sub=$(az account show --query id -o tsv)
          url="https://management.azure.com/subscriptions/$sub/resourceGroups/$RG/providers/Microsoft.Web/sites/$APP/sitecontainers/$CONTAINER?api-version=2024-04-01"
          az rest --method get --url "$url" \
            | jq --arg image "$IMAGE_REF" --arg port "$PORT" \
                '{properties: (.properties | del(.createdTime, .lastModifiedTime) | .image = $image | .targetPort = $port)}' \
            > container.json
          az rest --method put --url "$url" --body @container.json --output none
          az webapp restart --name "$APP" --resource-group "$RG"
          echo "Deployed $IMAGE_REF"

      - name: Verify availability
        id: verify
        run: |
          host=$(az webapp show --name "$APP" --resource-group "$RG" --query defaultHostName -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"
          for path in / /api/test; do
            curl --fail --silent --show-error --output /dev/null --max-time 10 \
              --retry 30 --retry-delay 10 --retry-connrefused --retry-all-errors \
              "https://$host$path"
          done
