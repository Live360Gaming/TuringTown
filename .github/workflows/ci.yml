name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Reused by deploy.yml to validate the exact released commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Build frontend
        working-directory: game
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.x

      # Restores, builds and runs any tests (succeeds when there are none).
      - name: Build and test backend
        run: dotnet test TuringTown.slnx --configuration Release

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: turingtown:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:8080 turingtown:ci
          # Require HTTP 200 from the frontend (/) and the health endpoint (/api/test).
          # Retries for up to ~60s while the container starts (connection errors / 5xx),
          # but fails immediately on any other non-200 status, e.g. a 404.
          if ! scripts/verify-endpoints.sh --strict --timeout 60 --interval 2 \
              http://localhost:8080 / /api/test; then
            echo "Container logs:"
            docker logs app
            exit 1
          fi
